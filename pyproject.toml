[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sweetrpg-db"
version = "0.0.146"
description = "MongoDB data access layer for SweetRPG services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "Paul Schifferer", email = "dm@sweetrpg.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "dnspython~=2.0",
    "marshmallow~=3.0",
    "mongoengine~=0.27",
    "PyMongo[srv]~=4.0",
    "sweetrpg-model-core",
    "sweetrpg-common",
]

[project.urls]
Documentation = "https://sweetrpg.github.io/db"

[project.scripts]
sweetrpg-db = "sweetrpg_db.cli:main"

[dependency-groups]
test = [
    "asgiref~=3.0",
    "blinker~=1.0",
    "coverage-badge~=1.0",
    "dnspython~=2.0",
    "pytest~=9.0",
    "pytest-cov~=7.0",
    "pytest-env~=1.0",
    "pytest-ordering~=0.6",
    "python-dotenv~=1.0",
]
docs = [
    "Pallets-Sphinx-Themes~=2.0",
    "Sphinx~=9.1",
    "sphinx-issues~=6.0",
    "sphinxcontrib-log-cabinet~=1.0",
    "sphinx-tabs~=3.0",
    "rstcheck~=6.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sweetrpg_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = [
    "sweetrpg_db",
    "tests",
]

[tool.coverage.paths]
source = [
    "src",
    "*/site-packages",
]
